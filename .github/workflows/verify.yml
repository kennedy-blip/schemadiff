name: Verify SchemaDiff

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python serverless functions
        run: python -m py_compile api/*.py
      - name: Validate Vercel configuration
        run: python -m json.tool vercel.json > /dev/null
